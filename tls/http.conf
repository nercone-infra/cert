http {
    include /etc/nginx/snippets/ruconet-http.conf;

    # RucoNet CA
    server {
        listen cert.ruconet.internal:443 ssl;

        include /etc/nginx/snippets/tls.conf;

        ssl_certificate        /etc/certs/ruconet/cert.pem;
        ssl_certificate_key    /etc/certs/ruconet/key.pem;
        ssl_client_certificate /etc/certs/ruconet/ca.pem;
        ssl_verify_client      optional;
        ssl_verify_depth       1;

        client_max_body_size 16k;

        location / {
            proxy_pass http://127.0.0.1:8080;

            proxy_http_version 1.0;

            proxy_set_header Host             $host;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Client-Verify  $ssl_client_verify;
            proxy_set_header X-Client-Subject $ssl_client_s_dn;
        }
    }
}
